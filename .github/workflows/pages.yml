# Đưa thư mục public/ lên GitHub Pages mỗi khi push vào main (sau khi test đạt).
# Cần bật: Settings -> Pages -> Source: GitHub Actions.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # cần >= 21: "node --test" mới hiểu mẫu tests/*.test.mjs
      - name: Test và kiểm định nội dung
        run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
